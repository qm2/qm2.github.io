<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>并排看器物 · 元青花 · 博物馆札记 | Merton</title><meta name="description" content="Merton看过的元青花与同时期瓷器：六件青花、两件比较作品，附现场照片、观看细节与收藏故事。"><link rel="stylesheet" href="../../museum.css"><link rel="stylesheet" href="../../sculpture-topics.css"><link rel="stylesheet" href="../../yuan-blue-and-white/ceramics.css"><script src="../../museum.js" defer></script></head><body id="top"><a class="skip-link" href="#main">跳至正文</a><header class="site-header"><a class="signature" href="../../">Merton</a><nav aria-label="主导航"><a href="../../chinese-ceramics/">中国陶瓷</a><a href="../../yuan-blue-and-white/compare/">并排看器物</a></nav></header><main id="main"><header class="category-header wrap"><p class="eyebrow">YUAN CERAMICS / SIDE BY SIDE</p><h1>并排看器物</h1><p class="index-intro">先看器形，再看纹样怎样贴着它展开。</p><p class="source">图片排列不代表器物实物的大小比例。</p><a href="../">← 返回元青花</a></header><section class="collection wrap" id="jars"><h2>两只罐，怎样安排一圈纹样</h2><p>从肩到腹再到足，看纹样带如何顺着器形展开。</p><div class="object-grid"><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-620.jpg" data-caption="青花缠枝牡丹纹罐 · 山西博物院 · Merton参观照片"><img src="../images/yuan-620.jpg" alt="青花缠枝牡丹纹罐 · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#shanxi-peony-jar">青花缠枝牡丹纹罐 →</a><p>山西博物院</p><p>元，1271—1368年</p><p class="source">青花</p></figcaption></figure><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-626.jpg" data-caption="青花双狮头罐 · 克利夫兰艺术博物馆 · Merton参观照片"><img src="../images/yuan-626.jpg" alt="青花双狮头罐 · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#lion-head-jar">青花双狮头罐 →</a><p>克利夫兰艺术博物馆</p><p>元，14世纪</p><p class="source">青花</p></figcaption></figure></div></section><section class="collection wrap" id="meiping"><h2>三只梅瓶，怎样安排瓶身画面</h2><p>四爱图将人物分入开光，牡丹凤纹沿纹样带展开，白龙则游走在蓝釉地上。相近器形，各有不同的观看顺序。</p><div class="object-grid"><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/wuhan-four-loves-60.jpg" data-caption="青花四爱图梅瓶 · 武汉博物馆 · Merton参观照片"><img src="../images/wuhan-four-loves-60.jpg" alt="青花四爱图梅瓶 · Merton参观照片" width="3024" height="4032" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#wuhan-four-loves">青花四爱图梅瓶 →</a><p>武汉博物馆</p><p>元，1271—1368年</p><p class="source">青花</p></figcaption></figure><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-622.jpg" data-caption="青花牡丹凤纹梅瓶（简永桢瓶） · 吉美亚洲艺术博物馆 · 巴黎 · Merton参观照片"><img src="../images/yuan-622.jpg" alt="青花牡丹凤纹梅瓶（简永桢瓶） · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#richard-kan-meiping">青花牡丹凤纹梅瓶（简永桢瓶） →</a><p>吉美亚洲艺术博物馆 · 巴黎</p><p>元，约1350年</p><p class="source">青花</p></figcaption></figure><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-624.jpg" data-caption="霁蓝釉留白划龙纹梅瓶 · 吉美亚洲艺术博物馆 · 巴黎 · Merton参观照片"><img src="../images/yuan-624.jpg" alt="霁蓝釉留白划龙纹梅瓶 · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#blue-glaze-dragon">霁蓝釉留白划龙纹梅瓶 →</a><p>吉美亚洲艺术博物馆 · 巴黎</p><p>元，14世纪</p><p class="source">比较作品 · 非青花</p></figcaption></figure></div></section><section class="collection wrap" id="surfaces"><h2>画出的线，浮起的纹</h2><p>凤鸟大盘与水波纹瓶用青花组织纹样；高足杯内的云龙则依靠浮雕、刻划与釉层呈现。</p><div class="object-grid"><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-628.jpg" data-caption="青花凤鸟花卉纹大盘 · 西雅图艺术博物馆 · Merton参观照片"><img src="../images/yuan-628.jpg" alt="青花凤鸟花卉纹大盘 · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#phoenix-dish">青花凤鸟花卉纹大盘 →</a><p>西雅图艺术博物馆</p><p>元，14世纪早期</p><p class="source">青花</p></figcaption></figure><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-630.jpg" data-caption="青花水波牡丹纹瓶 · 纳尔逊－阿特金斯艺术博物馆 · Merton参观照片"><img src="../images/yuan-630.jpg" alt="青花水波牡丹纹瓶 · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#wave-vase">青花水波牡丹纹瓶 →</a><p>纳尔逊－阿特金斯艺术博物馆</p><p>元，14世纪</p><p class="source">青花</p></figcaption></figure><figure class="object-card ceramic-comparison"><a class="photo-link" href="../images/yuan-632.jpg" data-caption="浮雕云龙纹高足杯 · 纳尔逊－阿特金斯艺术博物馆 · Merton参观照片"><img src="../images/yuan-632.jpg" alt="浮雕云龙纹高足杯 · Merton参观照片" width="1280" height="1707" loading=lazy decoding="async"><span class="photo-hint">查看大图 ↗</span></a><figcaption><a href="../#dragon-stem-cup">浮雕云龙纹高足杯 →</a><p>纳尔逊－阿特金斯艺术博物馆</p><p>14世纪；现场展签断为元代</p><p class="source">比较作品 · 非青花</p></figcaption></figure></div></section></main><footer class="site-footer wrap"><a href="../../">← 博物馆札记</a><span>摄影 / Merton</span><a href="#top">回到顶部 ↑</a></footer><dialog id="lightbox" aria-labelledby="lightbox-caption"><button class="close-lightbox" type="button" aria-label="关闭大图">关闭 ×</button><img id="lightbox-image" alt=""><p id="lightbox-caption"></p><a id="original-link" href="#" target="_blank" rel="noopener">单独打开照片 ↗</a></dialog></body></html>
